/* shared.jsx — hooks, atoms, color constants */
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* ── Scroll-triggered visibility (with iframe fallback) ── */
function useInView(opts = {}) {
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;

    /* Primary: IntersectionObserver */
    let obs;
    try {
      obs = new IntersectionObserver(
        ([e]) => { if (e.isIntersecting) { setInView(true); if (opts.once !== false) obs.unobserve(el); } },
        { threshold: opts.threshold || 0.12 }
      );
      obs.observe(el);
    } catch (_) { /* observer unsupported — fallback below handles it */ }

    /* Fallback: if observer doesn't fire within 600ms, check manually via getBoundingClientRect */
    const fallbackTimer = setTimeout(() => {
      const rect = el.getBoundingClientRect();
      const vh = window.innerHeight || document.documentElement.clientHeight;
      if (rect.top < vh + 100 && rect.bottom > -100) {
        setInView(true);
      }
    }, 600);

    /* Also listen for scroll to trigger elements further down */
    const onScroll = () => {
      const rect = el.getBoundingClientRect();
      const vh = window.innerHeight || document.documentElement.clientHeight;
      if (rect.top < vh * 0.92 && rect.bottom > 0) {
        setInView(true);
        window.removeEventListener('scroll', onScroll);
      }
    };
    window.addEventListener('scroll', onScroll, { passive: true });

    return () => {
      clearTimeout(fallbackTimer);
      window.removeEventListener('scroll', onScroll);
      if (obs) obs.disconnect();
    };
  }, []);
  return [ref, inView];
}

/* ── Animated count-up (fires once) ── */
function useCounter(target, dur = 2000, active = false) {
  const [count, setCount] = useState(0);
  const fired = useRef(false);
  useEffect(() => {
    if (!active || fired.current) return;
    fired.current = true;
    let start = null;
    const step = (ts) => {
      if (!start) start = ts;
      const p = Math.min((ts - start) / dur, 1);
      setCount(Math.round((1 - Math.pow(1 - p, 3)) * target));
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }, [active, target, dur]);
  return count;
}

/* ── Color palette ── */
const C = {
  mint: '#5CE0B8', gold: '#F5C518', purple: '#6B46C1',
  blue: '#3B82F6', red: '#ef4444', bg: '#070510',
  card: '#0d0a17', cardLt: '#110e1d',
};

/* ── Saturn CoinMark (simplified) ── */

    </svg>
  );
}

/* ── Shimmer text ── */
function ShimmerText({ children, style = {} }) {
  return <span className="shimmer-text" style={style}>{children}</span>;
}

/* ── Section eyebrow (divider + label) ── */
function Eyebrow({ text, color = C.mint }) {

    <div style={{ display: 'flex', alignItems: 'center', gap: 16, marginBottom: 28 }}>
      <div style={{ width: 40, height: 2, background: color, borderRadius: 1, flexShrink: 0 }}/>
      <span style={{
        fontFamily: "'Space Mono', monospace", fontSize: 13,
        letterSpacing: '0.14em', textTransform: 'uppercase', color,
      }}>{text}</span>
    </div>
  );
}

/* ── Fade-up on scroll (IntersectionObserver) ── */
function FadeUp({ delay = 0, children, style = {}, className = '' }) {
  const [ref, inView] = useInView();
  return (
    <div ref={ref} className={className} style={{
      opacity: inView ? 1 : 0,
      transform: inView ? 'translateY(0)' : 'translateY(32px)',
      transition: `opacity 0.8s cubic-bezier(0.16,1,0.3,1) ${delay}s, transform 0.8s cubic-bezier(0.16,1,0.3,1) ${delay}s`,
      ...style,
    }}>
      {children}
    </div>
  );
}

/* ── Inline SVG check icon ── */
function CheckIcon({ size = 12, color = C.mint }) {
  return (
    <svg width={size} height={size} viewBox="0 0 12 12" fill="none" style={{ verticalAlign: 'middle', flexShrink: 0 }} aria-hidden="true">
      <path d="M2.5 6.5L5 9L9.5 3.5" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

/* ── Expose globally ── */
Object.assign(window, { useInView, useCounter, C, CoinMark, ShimmerText, Eyebrow, FadeUp, CheckIcon });

function Toast({ message, visible }) {

    <div style={{
      position: 'fixed', bottom: 32, left: '50%',

}
